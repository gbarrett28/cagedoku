name: Sync rule-bug fixtures

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-rule-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needs a token with write access to push the branch below.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity and create sync branch
        # Every commit this run makes lands on this branch, never master
        # directly -- see "Push branch and open PR" below.
        id: branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          BRANCH="sync-rule-fixtures/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Fetch new fixtures from worker
        # Must run with working-directory: web (like every other step here)
        # so npx resolves the vite-node already installed by npm ci (a
        # vitest transitive dependency, never a direct one -- see
        # package.json). Run from the repo root, npx can't see that local
        # install and instead downloads a fresh, unpinned "latest" vite-node
        # from the registry every time; vite-node@6.0.0 did that and blew
        # through the default ~4GB heap on this script (JS heap OOM, exit
        # 134), while the locally-resolved version (used by every other
        # `npx vite-node` invocation in this project, including this same
        # script run manually) has never shown this failure.
        working-directory: web
        env:
          TRAINING_WORKER_URL: ${{ secrets.TRAINING_WORKER_URL }}
        run: npx vite-node scripts/sync-rule-fixtures.ts

      - name: Bronze gate
        working-directory: web
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npm test

      - name: Commit fixtures
        run: |
          git add web/src/engine/rules/__fixtures__/index.ts web/src/engine/rules/__fixtures__/needs-triage.ts
          git diff --cached --quiet && echo "No fixture changes." || \
            git commit -m "chore: sync rule-bug fixtures"

      - name: Push branch and open PR
        # Never pushes to master directly -- new fixtures go through normal
        # review like any other change, rather than landing unattended.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet origin/master HEAD; then
            echo "No changes relative to master; nothing to open a PR for."
            exit 0
          fi
          git push -u origin "${{ steps.branch.outputs.name }}"
          gh pr create \
            --title "chore: sync rule-bug fixtures $(date -u +%Y-%m-%d)" \
            --body "Automated fixture sync from the rule-bug training worker (run ${{ github.run_id }}). New fixtures land in needs-triage.ts pending manual review -- see docs/architecture.md's Rule Contract for the triage process." \
            --base master \
            --head "${{ steps.branch.outputs.name }}"

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Drain synced fixtures from R2
        if: success()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -s /tmp/rule-fixture-keys.txt ]; then
            pip install --quiet boto3
            python3 scripts/_r2_delete.py cagedoku-training < /tmp/rule-fixture-keys.txt
          else
            echo "No fixtures fetched; nothing to drain."
          fi
