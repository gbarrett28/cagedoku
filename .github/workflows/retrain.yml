name: Retrain digit recogniser

on:
  # Schedule disabled 2026-07-30: an unmonitored scheduled run (0c860c8)
  # shipped a broken model that regressed real-world solve rate from ~97%
  # to well below that, undetected for weeks. 2026-08-01: the workflow no
  # longer pushes directly to master (see "Push branch and open PR" below --
  # every retrain now lands as a PR for human review before merge), which
  # closes the specific failure mode that caused that incident. Still left
  # off pending a decision on unattended/scheduled operation in general --
  # re-enabling the schedule means unreviewed PRs can pile up unattended,
  # which is a separate question from whether a single run is safe.
  # schedule:
  #   - cron: '0 */8 * * *'  # every 8 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity
        # Must run before any step that commits -- "Merge samples into
        # corpus_train.json" below commits too, and previously ran before
        # identity was configured (that config lived only in the later
        # "Commit updated model" step), failing with "empty ident name".
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create retrain branch
        # Every commit this run makes lands on this branch, never master
        # directly -- see "Push branch and open PR" below.
        id: branch
        run: |
          BRANCH="retrain/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        # Pin coverage<7.8: numba 0.66.0 uses coverage.types.Tracer which was
        # removed in coverage 7.8; pin to keep the import working.
        run: pip install -e . "coverage<7.8"

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: List pending R2 uploads
        id: list
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/_r2_list.py cagedoku-training training/ > /tmp/r2_keys.txt
          COUNT=$(wc -l < /tmp/r2_keys.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT pending upload(s)."

      - name: Download pending uploads
        if: steps.list.outputs.count != '0'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p /tmp/training
          python3 scripts/_r2_download.py cagedoku-training /tmp/training < /tmp/r2_keys.txt

      - name: Merge samples into corpus_train.json
        if: steps.list.outputs.count != '0'
        run: |
          node --input-type=module <<'EOF'
          import { globSync, readFileSync, writeFileSync } from 'node:fs';
          const basePath = 'web/corpus_train.json';
          const base = JSON.parse(readFileSync(basePath, 'utf8'));
          for (const file of globSync('/tmp/training/sample_*.json').sort()) {
            const incoming = JSON.parse(readFileSync(file, 'utf8'));
            base.samples.push(...(incoming.samples ?? []));
          }
          base.sampleCount = base.samples.length;
          writeFileSync(basePath, JSON.stringify(base));
          EOF
          git add web/corpus_train.json
          git diff --cached --quiet && echo "No sample changes." || \
            git commit -m "chore: merge new browser samples into corpus_train.json"

      - name: Retrain
        if: steps.list.outputs.count != '0'
        # No positional training_json args here: --browser-file defaults to
        # web/corpus_train.json (just merged above, including this run's new
        # samples), which is the only way to get --browser-weight applied to
        # them. Passing it a second time positionally (as this used to) put it
        # in the unweighted "bulk" bucket instead, so freshly-collected samples
        # never actually got the up-weighting this flag exists to provide.
        run: |
          python web/train_recogniser.py \
            --recogniser pca \
            --browser-weight 1000

      - name: Evaluate accuracy
        if: steps.list.outputs.count != '0'
        id: eval
        run: |
          cd web
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cagedoku-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/cagedoku-preview.log
            exit 1
          fi

          npx vite-node --script scripts/evaluate-corpus.ts \
            --base-url http://127.0.0.1:4173 \
            --puzzle-dir eval-fixtures \
            --db-path /tmp/eval-candidate.db \
            --git-hash candidate \
            --workers 1 \
            --report-out /tmp/eval-candidate.json \
            --compare-report eval-baseline.json

      - name: Open failure issue on regression
        if: failure() && steps.eval.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Retrain regression detected $(date -u +%Y-%m-%d)" \
            --body "The scheduled retrain detected an accuracy regression. Check the failed run for details. The model was NOT updated." \
            --label "bug"

      - name: Commit updated model
        if: steps.list.outputs.count != '0'
        run: |
          git add web/public/num_recogniser.json web/public/num_recogniser.bin
          git diff --cached --quiet && echo "No model changes." || \
            git commit -m "chore: retrain digit recogniser with new browser samples"

      - name: Push branch and open PR
        # Never pushes to master directly. A regression that clears the
        # eval-fixtures check (a small, non-exhaustive fixture set -- see the
        # "Schedule disabled" note above) still lands as a PR, not a direct
        # commit, so a human reviews the corpus-eval comparison before any
        # model change reaches production.
        if: steps.list.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet origin/master HEAD; then
            echo "No changes relative to master; nothing to open a PR for."
            exit 0
          fi
          git push -u origin "${{ steps.branch.outputs.name }}"
          gh pr create \
            --title "chore: retrain digit recogniser $(date -u +%Y-%m-%d)" \
            --body "Automated retrain from new browser training samples (run ${{ github.run_id }}). Corpus-eval comparison against eval-baseline.json passed -- see this run's \"Evaluate accuracy\" step for the full report. Review before merging; this workflow never pushes to master directly." \
            --base master \
            --head "${{ steps.branch.outputs.name }}"

      - name: Delete processed R2 objects
        if: steps.list.outputs.count != '0'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/_r2_delete.py cagedoku-training < /tmp/r2_keys.txt

      - name: React to processed GitHub Issue comments
        if: steps.list.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/gbarrett28/cagedoku/issues/1/comments --jq '.[].id' | \
          while IFS= read -r comment_id; do
            body=$(gh api "repos/gbarrett28/cagedoku/issues/comments/$comment_id" --jq '.body // ""')
            if echo "$body" | grep -q 'training/'; then
              echo "Reacting to comment $comment_id"
              gh api "repos/gbarrett28/cagedoku/issues/comments/$comment_id/reactions" \
                -f content='+1' > /dev/null
            fi
          done
