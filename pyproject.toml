[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cagedoku"
version = "0.1.0"
description = "Killer sudoku coaching tool with a browser-based OCR pipeline"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "botocore",
    "matplotlib",
    "numba",
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["killer_sudoku*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["archive.py", "no_gutter.py"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "D",    # pydocstyle
    "Q",    # flake8-quotes
    "T20",  # flake8-print (no bare print statements)
    "ERA",  # eradicate (no commented-out code)
    "PLC",  # Pylint convention
    "PLW",  # Pylint warnings
    "PL",   # Pylint full
    "RUF",  # Ruff-native rules
]
ignore = [
    "E501",    # line-too-long — handled by line-length = 120
    "SIM108",  # ternary operator — hurts readability
    "ARG002",  # unused method argument — common in callbacks/inheritance
    "D100",    # missing module docstring
    "D101",    # missing class docstring
    "D102",    # missing method docstring
    "D103",    # missing function docstring
    "D104",    # missing package docstring
    "D105",    # missing magic method docstring
    "D107",    # missing __init__ docstring
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "PLR2004", # magic value in comparison
    "C901",    # too complex
]
dummy-variable-rgx = "^_.*$"

[tool.ruff.lint.per-file-ignores]
# The trainer lazily imports Pillow and matplotlib only on image/font paths to
# avoid their startup cost. T20 is allowed because this is a CLI script.
# N803/N806: X is a standard sklearn feature-matrix convention (uppercase is idiomatic).
# PLW2901: reassigning loop var to downcast dtype is intentional (in-place reshape).
"web/train_recogniser.py" = ["PLC0415", "T20", "N803", "N806", "PLW2901"]
# PreToolUse hook: print(json.dumps(...)) to stdout IS the hook protocol's
# output mechanism (Claude Code reads it), not debug output. PLR0911: a
# hook structured as a series of early-exit guard clauses naturally has
# more return points than the default limit.
".claude/hooks/enforce-serena.py" = ["T20", "PLR0911"]
".codex/hooks/enforce-serena.py" = ["T20", "PLR0911"]
# CLI training scripts: print() is the output mechanism
"killer_sudoku/training/*.py" = ["T20"]
# CLI utility scripts: print() is the output mechanism
"scripts/_r2_*.py" = ["T20"]
# Tests: sys.path manipulation before imports is standard pytest pattern.
# N806: X is a standard feature-matrix variable (sklearn convention).
# D205: test docstrings describe the scenario as a flowing paragraph, not summary+description.
"tests/*.py" = ["E402", "N806", "D205"]
# Stub files don't need docstrings; N803/N806 don't apply to type stubs.
# UP047: PEP 695 type param syntax is Python 3.12+ only — stubs target older versions too.
"stubs/**/*.pyi" = ["D", "N803", "N806", "UP047"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = [".", "stubs"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
exclude = ["archive\\.py", "no_gutter\\.py"]
